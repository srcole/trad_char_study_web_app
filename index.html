<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traditional → Simplified Chinese</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="game-container">
    <header>
      <h1>Traditional → Simplified</h1>
      <p class="subtitle">
        Type the corresponding simplified Chinese character.
      </p>
    </header>

    <section class="card">
      <div class="progress" id="progress">Question 1</div>

      <div class="label">Traditional Chinese</div>

      <div class="character" id="traditionalCharacter">
        這
      </div>

      <form id="answerForm">
        <input
          id="answerInput"
          type="text"
          maxlength="1"
          autocomplete="off"
          placeholder="Type simplified character"
          autofocus
        />

        <button type="submit" id="submitButton">
          Check Answer
        </button>
      </form>

      <div id="feedback" class="feedback hidden">
        <div id="resultMessage"></div>

        <div class="answer-details">
          <div>
            <span class="detail-label">Simplified:</span>
            <span id="correctCharacter" class="correct-character"></span>
          </div>

          <div>
            <span class="detail-label">Pinyin:</span>
            <span id="pinyin"></span>
          </div>

          <div>
            <span class="detail-label">English:</span>
            <span id="english"></span>
          </div>
        </div>

        <button id="nextButton" type="button">
          Next Character →
        </button>
      </div>
    </section>

    <section class="stats">
      <div>
        <span class="stat-number" id="correctCount">0</span>
        <span class="stat-label">Correct</span>
      </div>

      <div>
        <span class="stat-number" id="totalCount">0</span>
        <span class="stat-label">Answered</span>
      </div>

      <div>
        <span class="stat-number" id="accuracy">0%</span>
        <span class="stat-label">Accuracy</span>
      </div>
    </section>

    <p id="errorMessage" class="error-message"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
